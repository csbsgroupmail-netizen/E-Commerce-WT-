<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product Listing Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
          <a class="navbar-brand" href="#">VCE E-Commerce</a>
        </div>
      </nav>
    </header>

    <main class="container my-5">
      <!-- Mobile Filter Button (Only visible on screens smaller than large 'lg') -->
      <div class="d-lg-none mb-3">
        <button
          class="btn btn-outline-dark w-100"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#filterSidebar"
          aria-controls="filterSidebar"
        >
          <i class="bi bi-sliders me-2"></i> Show Filters
        </button>
      </div>

      <div class="row g-4">
        <!-- 1. FILTER SIDEBAR (Offcanvas on mobile, fixed column on desktop) -->
        <aside class="col-lg-3">
          <div
            class="offcanvas-lg offcanvas-start bg-body p-lg-0"
            tabindex="-1"
            id="filterSidebar"
            aria-labelledby="filterSidebarLabel"
          >
            <!-- Sidebar Mobile Header -->
            <div class="offcanvas-header border-bottom d-lg-none">
              <h5 class="offcanvas-title" id="filterSidebarLabel">Filters</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="offcanvas"
                data-bs-target="#filterSidebar"
                aria-label="Close"
              ></button>
            </div>

            <!-- Sidebar Content / Filter Accordion -->
            <div class="offcanvas-body d-flex flex-column gap-4 p-3 p-lg-0">
              <h3 class="h4 d-none d-lg-block mb-0">Filters</h3>

              <!-- Filter Group 1: Subcategories -->
              <div class="card p-3 shadow-sm">
                <h6 class="fw-bold mb-3">Availability</h6>
                <div class="form-check mb-2">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="instock"
                  />
                  <label class="form-check-input-label" for="instock"
                    >In Stock</label
                  >
                </div>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="preorder"
                  />
                  <label class="form-check-input-label" for="preorder"
                    >Pre-order</label
                  >
                </div>
              </div>

              <!-- Filter Group 2: Price Range -->
              <div class="card p-3 shadow-sm">
                <h6 class="fw-bold mb-3">Price Range</h6>
                <input
                  type="range"
                  class="form-range mb-2"
                  min="0"
                  max="1000"
                  id="priceRange"
                />
                <div class="d-flex justify-content-between text-muted small">
                  <span>$0</span>
                  <span>$1000</span>
                </div>
              </div>

              <!-- Filter Group 3: Sorting -->
              <div class="card p-3 shadow-sm">
                <h6 class="fw-bold mb-3">Sort By</h6>
                <select class="form-select form-select-sm">
                  <option selected>Popularity</option>
                  <option>Price: Low to High</option>
                  <option>Price: High to Low</option>
                  <option>Newest Arrivals</option>
                </select>
              </div>

              <!-- Apply Button for Mobile Drawer View -->
              <button
                class="btn btn-primary d-lg-none w-100 mt-2"
                data-bs-dismiss="offcanvas"
                data-bs-target="#filterSidebar"
              >
                Apply Filters
              </button>
            </div>
          </div>
        </aside>

        <!-- 2. PRODUCT MAIN CONTENT AREA (Takes up remaining 9 columns on desktop) -->
        <section class="col-lg-9">
          <h2 class="mb-4">Product Categories</h2>

          <div class="row g-4">
            <!-- Electronics -->
            <div class="col-12 col-sm-6 col-md-6 col-xl-4">
              <div class="card h-100 text-center p-3 shadow-sm">
                <h4>Electronics</h4>
                <p class="text-muted">Mobiles, laptops and gadgets</p>
                <!-- The link wraps the entire button -->
                <a
                  href="/E-Com_Bootstrap/products/electronic.html"
                  class="mt-auto"
                >
                  <button class="btn btn-primary w-auto">View</button>
                </a>
              </div>
            </div>

            <!-- Fashion -->
            <div class="col-12 col-sm-6 col-md-6 col-xl-4">
              <div class="card h-100 text-center p-3 shadow-sm">
                <h4>Fashion</h4>
                <p class="text-muted">Clothes, shoes and accessories</p>
                <a
                  href="/E-Com_Bootstrap/products/fashion.html"
                  class="mt-auto"
                >
                  <button class="btn btn-success mt-auto">View</button>
                </a>
              </div>
            </div>

            <!-- Home -->
            <div class="col-12 col-sm-6 col-md-6 col-xl-4">
              <div class="card h-100 text-center p-3 shadow-sm">
                <h4>Home</h4>
                <p class="text-muted">Furniture and home products</p>
                <a href="/E-Com_Bootstrap/products/home_decor.html">
                  <button class="btn btn-warning mt-auto">View</button>
                </a>
              </div>
            </div>

            <!-- Beauty 
            <div class="col-12 col-sm-6 col-md-6 col-xl-4">
              <div class="card h-100 text-center p-3 shadow-sm">
                <h4>Beauty</h4>
                <p class="text-muted">Beauty and personal care</p>
                <a href="/E-Com_Bootstrap/products/beauty.html">
                  <button class="btn btn-danger mt-auto">View</button>
                </a>
              </div>
            </div>
          </div>-->
        </section>
      </div>
    </main>

    <footer class="bg-dark text-white text-center p-3">
      <p class="mb-0">All Rights Reserved</p>
    </footer>
  </body>
</html>
